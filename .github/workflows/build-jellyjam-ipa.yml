name: Build Jelly Jam unsigned IPA

on:
  workflow_dispatch:

jobs:
  compile-ios:
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout files and download Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Unity iOS export and Git LFS
        shell: bash
        run: |
          set -euo pipefail
          if [ -d 'IOSExport/Unity-iPhone.xcodeproj' ]; then
            EXPORT_DIR='IOSExport'
          elif [ -d 'iOSExport/Unity-iPhone.xcodeproj' ]; then
            EXPORT_DIR='iOSExport'
          else
            echo 'ERROR: Unity-iPhone.xcodeproj not found under IOSExport or iOSExport.'
            echo 'Root files:'
            ls -la
            exit 1
          fi
          echo "IOS_EXPORT_DIR=$EXPORT_DIR" >> "$GITHUB_ENV"
          echo "Found Unity export in $EXPORT_DIR"
          git lfs ls-files
          RUNTIME="$EXPORT_DIR/Frameworks/UnityRuntime.framework/UnityRuntime"
          if [ -f "$RUNTIME" ]; then
            FILESIZE=$(stat -f%z "$RUNTIME")
            echo "UnityRuntime size: $FILESIZE bytes"
            if [ "$FILESIZE" -lt 100000000 ]; then
              echo 'ERROR: UnityRuntime is unexpectedly small. Git LFS content was not retrieved.'
              exit 1
            fi
          else
            echo 'ERROR: UnityRuntime binary not found.'
            exit 1
          fi
          xcodebuild -version

      - name: Skip Unity symbol-processing phases for unsigned playtest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import re, os
          project = Path(os.environ['IOS_EXPORT_DIR']) / 'Unity-iPhone.xcodeproj' / 'project.pbxproj'
          original = project.read_text()
          phase_blocks = re.compile(r'(?ms)^\s*[A-F0-9]{24} /\*.*?\*/ = \{\n\s*isa = PBXShellScriptBuildPhase;.*?^\s*\};')
          changed = [0]
          def fix(block_match):
              block = block_match.group(0)
              if not re.search(r'name = "?Unity Process symbols', block):
                  return block
              updated, n = re.subn(r'(?m)^(\s*shellScript = ).*?;\s*$', r'\1"echo Skipping Unity symbol processing for unsigned test build";', block, count=1)
              if n != 1:
                  raise SystemExit('ERROR: Found Unity symbol phase but could not replace its script safely')
              changed[0] += 1
              return updated
          output = phase_blocks.sub(fix, original)
          if changed[0] == 0:
              raise SystemExit('ERROR: No Unity Process symbols build phase found; project layout differs')
          project.write_text(output)
          print(f'Disabled {changed[0]} Unity symbol-processing build phase(s) in temporary GitHub checkout.')
          PYTHON

      - name: Compile Unity iOS app without signing
        shell: bash
        run: |
          set -euo pipefail
          set +e
          xcodebuild \
            -project "$IOS_EXPORT_DIR/Unity-iPhone.xcodeproj" \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/JellyJam.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            'CODE_SIGN_IDENTITY=' \
            archive 2>&1 | tee "$RUNNER_TEMP/jellyjam-xcode.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo '::group::Xcode errors and nearby diagnostics'
            grep -n -i -E -C 5 'error:|fatal error|PhaseScriptExecution|command .*failed|ARCHIVE FAILED|permission denied|no such file or directory' "$RUNNER_TEMP/jellyjam-xcode.log" | tail -n 220 || true
            echo '::endgroup::'
            exit "$STATUS"
          fi

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/JellyJam.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo 'ERROR: Xcode did not produce an .app under the archive.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/unsigned-package/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/unsigned-package/Payload/$(basename "$APP_PATH")"
          cd "$RUNNER_TEMP/unsigned-package"
          ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/JellyJam-unsigned.ipa"
          ls -lh "$GITHUB_WORKSPACE/JellyJam-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: JellyJam-unsigned-IPA
          path: JellyJam-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
